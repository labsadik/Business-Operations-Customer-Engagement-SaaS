# Build and deploy a new container revision to an already-configured Cloud Run service.
# First deployment is documented in docs/DEPLOY_GCP_CLOUD_RUN.md.
# Create a Cloud Build trigger on main only after service settings/secrets exist.

substitutions:
  _REGION: asia-south1
  _REPOSITORY: canvas
  _IMAGE: canvas-web
  _SERVICE: canvas-web
  _NEXT_PUBLIC_APP_URL: https://canvas.example.com
  _NEXT_PUBLIC_APP_NAME: Canvas
  _NEXT_PUBLIC_COMPANY_NAME: AlgoQuit
  _NEXT_PUBLIC_SENTRY_DSN: ""
  _NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
  _NEXT_PUBLIC_SENTRY_RELEASE: ""
  _NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ""
  _NEXT_PUBLIC_UMAMI_SCRIPT_URL: ""
  _NEXT_PUBLIC_UMAMI_WEBSITE_ID: ""
  _NEXT_PUBLIC_MIXPANEL_TOKEN: ""
  _NEXT_PUBLIC_CLARITY_PROJECT_ID: ""

steps:
  - id: Build image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --build-arg=NEXT_PUBLIC_APP_URL=$_NEXT_PUBLIC_APP_URL
      - --build-arg=NEXT_PUBLIC_APP_NAME=$_NEXT_PUBLIC_APP_NAME
      - --build-arg=NEXT_PUBLIC_COMPANY_NAME=$_NEXT_PUBLIC_COMPANY_NAME
      - --build-arg=NEXT_PUBLIC_SENTRY_DSN=$_NEXT_PUBLIC_SENTRY_DSN
      - --build-arg=NEXT_PUBLIC_SENTRY_ENVIRONMENT=$_NEXT_PUBLIC_SENTRY_ENVIRONMENT
      - --build-arg=NEXT_PUBLIC_SENTRY_RELEASE=$_NEXT_PUBLIC_SENTRY_RELEASE
      - --build-arg=NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=$_NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE
      - --build-arg=NEXT_PUBLIC_UMAMI_SCRIPT_URL=$_NEXT_PUBLIC_UMAMI_SCRIPT_URL
      - --build-arg=NEXT_PUBLIC_UMAMI_WEBSITE_ID=$_NEXT_PUBLIC_UMAMI_WEBSITE_ID
      - --build-arg=NEXT_PUBLIC_MIXPANEL_TOKEN=$_NEXT_PUBLIC_MIXPANEL_TOKEN
      - --build-arg=NEXT_PUBLIC_CLARITY_PROJECT_ID=$_NEXT_PUBLIC_CLARITY_PROJECT_ID
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$BUILD_ID
      - .
  - id: Push image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$BUILD_ID
  - id: Deploy Cloud Run revision
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$BUILD_ID
      - --region=$_REGION
      - --platform=managed
      - --quiet

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
